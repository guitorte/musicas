<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Músicas | Gui Torte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0A0A0A;
            --surface: #1A1A1A;
            --primary-text: #F5F5F5;
            --secondary-text: #888888;
            --accent: #FFFFFF;
            --border-color: #2a2a2a;
            --player-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--primary-text);
            -webkit-font-smoothing: antialiased;
            /* Espaço para o player fixo */
            padding-bottom: var(--player-height); 
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .music-list {
            list-style: none;
            counter-reset: song-counter;
        }

        .music-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }

        .music-list-item:hover {
            background: var(--surface);
        }

        .track-info {
            display: flex;
            align-items: center;
        }

        .track-number {
            font-size: 14px;
            font-weight: 500;
            color: var(--secondary-text);
            width: 30px;
            text-align: center;
            margin-right: 15px;
        }
        
        .track-title {
            font-size: 16px;
            font-weight: 500;
        }

        .music-list-item.active .track-title,
        .music-list-item.active .track-number {
            color: var(--accent);
            font-weight: 600;
        }
        
        .track-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .song-duration {
            font-size: 14px;
            color: var(--secondary-text);
        }

        .playing-indicator { display: none; }
        .music-list-item.playing .playing-indicator { display: block; }
        .music-list-item.playing .song-duration { display: none; }
        
        /* --- PLAYER BAR --- */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--player-height);
            background: #121212;
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }
        
        .progress-container {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 5px;
            cursor: pointer;
        }
        .progress-bar {
            background: var(--secondary-text);
            width: 100%;
            height: 2px;
            position: absolute;
            top: 4px;
        }
        .progress {
            background: var(--accent);
            width: 0%;
            height: 100%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .current-track-info {
            font-size: 14px;
        }
        .current-track-title { font-weight: 600; }
        .current-track-artist { font-weight: 400; color: var(--secondary-text); }


        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
        }
        .control-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }
        .control-btn svg { width: 24px; height: 24px; }
        
        .play-btn {
            background: var(--accent);
            color: var(--background);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
            color: var(--background);
        }
        .play-btn svg { width: 20px; height: 20px; }

        .extra-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }
        
        .volume-control { position: relative; }
        
        .volume-popup {
            position: absolute;
            bottom: 45px;
            right: -25px;
            background: var(--surface);
            padding: 15px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s ease;
        }
        .volume-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .volume-slider {
             -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .control-btn.active { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Minhas Músicas</h1>
        </div>

        <ol class="music-list">
            <!-- As músicas serão injetadas aqui pelo JavaScript -->
        </ol>
    </div>

    <!-- Player Bar Fixo -->
    <div class="player-bar">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="current-track-info">
            <div class="current-track-title">Selecione uma música</div>
            <div class="current-track-artist">Gui Torte</div>
        </div>

        <div class="player-controls">
            <button class="control-btn" id="prevBtn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
            </button>
            <button class="control-btn play-btn" id="playBtn">
                <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                <svg id="pauseIcon" style="display: none;" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
            </button>
            <button class="control-btn" id="nextBtn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg>
            </button>
        </div>

        <div class="extra-controls">
            <div class="volume-control">
                <button class="control-btn" id="volumeBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
                </button>
                <div class="volume-popup" id="volumePopup">
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                </div>
            </div>
            <button class="control-btn" id="repeatBtn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg>
            </button>
        </div>
    </div>
    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const songs = {
                song1: { title: "Vem com tudo, pisa!", src: "/audios/vem-com-tudo-pisa.mp3" },
                song2: { title: "A gente não tem nada", src: "/audios/a-gente-nao-tem-nada.mp3" },
                song3: { title: "Queima", src: "/audios/queima-v5.mp3" },
                song4: { title: "Tô fumando pedra", src: "/audios/to-fumando-pedra.mp3" },
                song5: { title: "Esperei", src: "/audios/eu-esperei-v3.mp3" },
                song6: { title: "Santo de Estuque", src: "/audios/santo-estuque.mp3" }
            };

            // DOM Elements
            const audioPlayer = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const repeatBtn = document.getElementById('repeatBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progress = document.getElementById('progress');
            const volumeBtn = document.getElementById('volumeBtn');
            const volumePopup = document.getElementById('volumePopup');
            const volumeSlider = document.getElementById('volumeSlider');
            const currentTrackTitle = document.querySelector('.current-track-title');
            const musicList = document.querySelector('.music-list');

            // Player State
            let currentSongId = null;
            let isPlaying = false;
            let isRepeating = false;
            let currentIndex = -1;
            const songKeys = Object.keys(songs);
            
            // --- Initialization ---
            function init() {
                renderMusicList();
                loadTrackDurations();
                attachEventListeners();
                audioPlayer.volume = 0.7;
            }

            function renderMusicList() {
                songKeys.forEach((key, index) => {
                    const song = songs[key];
                    const li = document.createElement('li');
                    li.className = 'music-list-item';
                    li.dataset.songId = key;
                    li.innerHTML = `
                        <div class="track-info">
                            <span class="track-number">${index + 1}</span>
                            <span class="track-title">${song.title}</span>
                        </div>
                        <div class="track-meta">
                            <span class="song-duration">--:--</span>
                            <div class="playing-indicator">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="${getComputedStyle(document.documentElement).getPropertyValue('--accent')}">
                                    <rect class="eq-bar" x="4" y="8" width="4" height="12" rx="1"><animate attributeName="height" values="12;6;14;8;12" dur="1s" repeatCount="indefinite" /></rect>
                                    <rect class="eq-bar" x="10" y="4" width="4" height="16" rx="1"><animate attributeName="height" values="16;10;18;6;16" dur="1.2s" repeatCount="indefinite" /></rect>
                                    <rect class="eq-bar" x="16" y="10" width="4" height="10" rx="1"><animate attributeName="height" values="10;14;6;12;10" dur="0.8s" repeatCount="indefinite" /></rect>
                                </svg>
                            </div>
                        </div>
                    `;
                    li.addEventListener('click', () => {
                        loadSong(key, index);
                        playSong();
                    });
                    musicList.appendChild(li);
                });
            }

            function loadTrackDurations() {
                songKeys.forEach(key => {
                    const audio = new Audio();
                    audio.src = songs[key].src;
                    audio.addEventListener('loadedmetadata', () => {
                        const li = musicList.querySelector(`[data-song-id="${key}"]`);
                        if (li) {
                            li.querySelector('.song-duration').textContent = formatTime(audio.duration);
                        }
                    });
                });
            }

            // --- Core Functions ---
            function loadSong(songId, index) {
                currentSongId = songId;
                currentIndex = index;
                const song = songs[songId];
                audioPlayer.src = song.src;
                currentTrackTitle.textContent = song.title;

                document.querySelectorAll('.music-list-item').forEach(item => {
                    item.classList.remove('active', 'playing');
                });
                const activeLi = musicList.querySelector(`[data-song-id="${songId}"]`);
                if (activeLi) activeLi.classList.add('active');
            }

            function playSong() {
                if (!currentSongId) return;
                audioPlayer.play();
                isPlaying = true;
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                const playingLi = musicList.querySelector(`[data-song-id="${currentSongId}"]`);
                if (playingLi) playingLi.classList.add('playing');
            }

            function pauseSong() {
                audioPlayer.pause();
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                document.querySelectorAll('.music-list-item').forEach(item => item.classList.remove('playing'));
            }

            function togglePlay() {
                if (!currentSongId) {
                    loadSong(songKeys[0], 0);
                }
                isPlaying ? pauseSong() : playSong();
            }

            function changeSong(direction) {
                const newIndex = (currentIndex + direction + songKeys.length) % songKeys.length;
                loadSong(songKeys[newIndex], newIndex);
                if (isPlaying) playSong();
            }
            
            // --- UI Updates ---
            function updateProgress() {
                if (audioPlayer.duration) {
                    const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                    progress.style.width = percentage + '%';
                }
            }

            function setProgress(e) {
                const width = this.clientWidth;
                const clickX = e.offsetX;
                if (audioPlayer.duration) {
                    audioPlayer.currentTime = (clickX / width) * audioPlayer.duration;
                }
            }

            function toggleRepeat() {
                isRepeating = !isRepeating;
                repeatBtn.classList.toggle('active', isRepeating);
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return isNaN(mins) || isNaN(secs) ? "--:--" : `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            // --- Event Listeners ---
            function attachEventListeners() {
                playBtn.addEventListener('click', togglePlay);
                prevBtn.addEventListener('click', () => changeSong(-1));
                nextBtn.addEventListener('click', () => changeSong(1));
                repeatBtn.addEventListener('click', toggleRepeat);
                
                audioPlayer.addEventListener('timeupdate', updateProgress);
                audioPlayer.addEventListener('ended', () => {
                    isRepeating ? playSong() : changeSong(1);
                });
                
                progressContainer.addEventListener('click', setProgress);
                
                volumeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    volumePopup.classList.toggle('active');
                });
                volumeSlider.addEventListener('input', (e) => {
                    audioPlayer.volume = e.target.value / 100;
                });
                
                document.addEventListener('click', (e) => {
                    if (!volumeControl.contains(e.target)) {
                        volumePopup.classList.remove('active');
                    }
                });
            }
            
            const volumeControl = document.querySelector('.volume-control');
            init();
        });
    </script>
</body>
</html>
