<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Músicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #121212;
            --surface: #1E1E1E;
            --surface-hover: #2a2a2a;
            --primary-text: #FAFAFA;
            --secondary-text: #A0A0A0;
            --accent: #FFFFFF;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--primary-text);
            min-height: 100vh;
            padding: 20px 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1.5px;
        }

        .header p {
            color: var(--secondary-text);
            font-size: 16px;
            font-weight: 400;
        }

        .music-list {
            list-style: none;
            counter-reset: song-counter;
            margin-bottom: 40px;
        }

        .music-list-item {
            display: flex;
            align-items: center;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s ease-in-out, transform 0.2s ease-in-out;
            font-size: 16px;
            font-weight: 500;
        }

        .music-list-item::before {
            content: counter(song-counter);
            counter-increment: song-counter;
            margin-right: 20px;
            font-weight: 500;
            font-size: 14px;
            color: var(--secondary-text);
            min-width: 28px;
            text-align: center;
            transition: color 0.2s ease-in-out;
        }

        .music-list-item:hover {
            background: var(--surface-hover);
            transform: scale(1.02);
        }

        .music-list-item.active {
            background: var(--surface);
            border-color: var(--accent);
        }
        
        .music-list-item.active::before {
            color: var(--accent);
            font-weight: 600;
        }

        /* --- NOVO LAYOUT DO PLAYER --- */
        .player {
            background: var(--surface);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .player-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .current-song {
            font-size: 18px;
            font-weight: 600;
            min-height: 27px; /* Evita que o layout pule */
        }

        .progress-container {
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .progress {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--secondary-text);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--secondary-text);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        
        .control-btn.active {
             color: var(--accent);
        }

        .control-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .play-btn {
            font-size: 24px;
            background: var(--accent);
            color: var(--background);
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background: #e0e0e0;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--secondary-text);
        }

        .volume-icon {
            font-size: 20px;
        }

        .volume-slider {
            flex-grow: 1;
            max-width: 150px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        /* --- FIM DO LAYOUT DO PLAYER --- */

        .contact-section {
            text-align: center;
            margin-top: 50px;
        }

        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--primary-text);
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .contact-btn:hover {
            background: var(--surface);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            .contact-buttons {
                flex-direction: column;
                align-items: center;
            }
            .contact-btn {
                width: 220px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Minhas Músicas</h1>
            <p>Pagode & Sertanejo</p>
        </div>

        <ol class="music-list">
            <li class="music-list-item" data-song="song1">Vem com tudo, pisa!</li>
            <li class="music-list-item" data-song="song2">A gente não tem nada</li>
            <li class="music-list-item" data-song="song3">Queima</li>
            <li class="music-list-item" data-song="song4">Tô fumando crack</li>
            <li class="music-list-item" data-song="song5">Esperei</li>
            <li class="music-list-item" data-song="song6">Santo de Estuque</li>
        </ol>

        <div class="player">
            <div class="player-info">
                <div class="current-song">Selecione uma música</div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="player-controls">
                <button class="control-btn" id="prevBtn">⏪</button>
                <button class="control-btn play-btn" id="playBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏩</button>
            </div>
            
            <div class="volume-container">
                <span class="volume-icon">🔉</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                <button class="control-btn" id="repeatBtn">🔁</button>
            </div>
            
            <audio id="audioPlayer" preload="metadata"></audio>
        </div>

        <div class="contact-section">
            <div class="contact-buttons">
                <a href="https://wa.me/5553999915426" class="contact-btn" target="_blank">WhatsApp</a>
                <a href="https://instagram.com/guitorte" class="contact-btn" target="_blank">Instagram</a>
            </div>
        </div>
    </div>

    <script>
        const songs = {
            song1: { title: "Vem com tudo, pisa!", src: "/audios/vem-com-tudo-pisa.mp3" },
            song2: { title: "A gente não tem nada", src: "/audios/a-gente-nao-tem-nada.mp3" },
            song3: { title: "Queima", src: "/audios/queima.mp3" },
            song4: { title: "Tô fumando crack", src: "/audios/to-fumando-crack.mp3" },
            song5: { title: "Esperei", src: "/audios/esperei.mp3" },
            song6: { title: "Santo de Estuque", src: "/audios/santo-de-estuque.mp3" }
        };

        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const currentSongEl = document.querySelector('.current-song');
        const musicItems = document.querySelectorAll('.music-list-item');

        let currentSong = null;
        let isPlaying = false;
        let isRepeating = false;
        let currentIndex = 0;
        const songKeys = Object.keys(songs);

        audioPlayer.volume = 0.7;

        function loadSong(songId, index) {
            if (currentSong === songId && isPlaying) return;
            currentSong = songId;
            currentIndex = index;
            const song = songs[songId];
            audioPlayer.src = song.src;
            currentSongEl.textContent = song.title;
            musicItems.forEach(item => item.classList.remove('active'));
            musicItems[index].classList.add('active');
        }

        function playSong() {
            if (!currentSong) return;
            audioPlayer.play();
            playBtn.innerHTML = '⏸';
            isPlaying = true;
        }

        function pauseSong() {
            audioPlayer.pause();
            playBtn.innerHTML = '▶';
            isPlaying = false;
        }

        function togglePlay() {
            if (!currentSong) {
                 // Se nenhuma música foi selecionada, toca a primeira
                loadSong(songKeys[0], 0);
                playSong();
                return;
            }
            isPlaying ? pauseSong() : playSong();
        }
        
        function changeSong(direction) {
             const newIndex = (currentIndex + direction + songKeys.length) % songKeys.length;
             loadSong(songKeys[newIndex], newIndex);
             if (isPlaying) playSong();
        }

        function toggleRepeat() {
            isRepeating = !isRepeating;
            repeatBtn.classList.toggle('active', isRepeating);
        }

        function updateProgress() {
            if (audioPlayer.duration) {
                const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progress.style.width = percentage + '%';
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        }
        
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            if(audioPlayer.duration) {
                audioPlayer.currentTime = (clickX / width) * audioPlayer.duration;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        musicItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                const songId = item.getAttribute('data-song');
                loadSong(songId, index);
                playSong();
            });
        });

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', () => changeSong(-1));
        nextBtn.addEventListener('click', () => changeSong(1));
        repeatBtn.addEventListener('click', toggleRepeat);
        volumeSlider.addEventListener('input', (e) => audioPlayer.volume = e.target.value / 100);
        audioPlayer.addEventListener('loadedmetadata', () => durationEl.textContent = formatTime(audioPlayer.duration));
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', () => isRepeating ? playSong() : changeSong(1));
        progressBar.addEventListener('click', setProgress);
    </script>
</body>
</html>
